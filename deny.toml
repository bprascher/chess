# cargo-deny 0.20.2 configuration (chess-a0r.2.2).
# Licences: allow list from docs/engineering/dependency-lookup-step1.md section 4 (accepted v0.2).
# Bans: ONLY the allowed workspace crate edges (architecture 3.2, D-38), via `wrappers`.
# No third-party crate is banned by name here.

[graph]
all-features = true
# The product is macOS only (PLAT-1). Without this, Linux and Windows only crates (for example the
# Tauri GTK stack) are checked and raise findings for code that is never built here.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]

[advisories]
version = 2
yanked = "deny"
# An ignore needs a written reason and a Decision Log entry (SWE-001 section 5).
ignore = [
    # RUSTSEC-2026-0441: `pin-utils` 0.1.1 is unmaintained (informational, not a vulnerability).
    # Reached only through the dev-dependency chain expectrl -> nix 0.26.4 -> pin-utils (CLI
    # end-to-end tests, DL2-11 A). No safe upgrade exists. cargo-deny has no dev-only scope, so
    # this waives the advisory for every crate; any other unmaintained crate still fails.
    # Decision: F3 option B, Brian Prascher, 2026-11-09 (G2). Record: VULN-004.
    # Revisit when expectrl or ptyprocess leaves nix 0.26, or the advisory gets a fix; and at the
    # CLI end-to-end task and at release.
    { id = "RUSTSEC-2026-0441", reason = "unmaintained pin-utils, dev-only via expectrl -> nix 0.26.4; no fix exists; VULN-004" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# Allow-list entries are written ahead of the crates that need them (F4 option A), so
# "not encountered" is expected until those crates are in Cargo.lock. Silenced for licences only.
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Unlicense",
    "GPL-3.0-or-later",
    # Permissive. Used by foldhash and zlib-rs (zip, DL2-1 A). Decision: F4 option A, 2026-11-09.
    "Zlib",
]
# MPL-2.0 is file-level copyleft and its text names the GNU GPL as a Secondary License, so it
# combines with this GPL-3.0-or-later project (a reading of licence names, not legal advice).
# It is allowed per crate, not globally, so a new MPL-2.0 crate stays visible and triggers the
# notice duty (NFR-6). All five arrive through Tauri: cssparser, cssparser-macros, dtoa-short and
# selectors through tauri-utils -> dom_query; option-ext through dirs-sys -> tauri-build.
# Re-check against the real Cargo.lock when desktop/src-tauri gets its first dependency
# (dependency-lookup-step2.md section 4.1, ASM-DL2-2).
exceptions = [
    { allow = ["MPL-2.0"], crate = "cssparser" },
    { allow = ["MPL-2.0"], crate = "cssparser-macros" },
    { allow = ["MPL-2.0"], crate = "dtoa-short" },
    { allow = ["MPL-2.0"], crate = "selectors" },
    { allow = ["MPL-2.0"], crate = "option-ext" },
]

[licenses.private]
# Workspace crates are publish = false and carry license = "GPL-3.0-or-later" anyway.
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# `wrappers` lists the only crates allowed to depend directly on the banned crate.
# An empty list means no crate may depend on it. Together these are the edges of section 3.2.
deny = [
    { crate = "chess-rules", wrappers = ["chess-domain", "chess-engine", "chess-app"], reason = "3.2: rules <- domain, engine, app" },
    { crate = "chess-domain", wrappers = ["chess-store", "chess-app"], reason = "3.2: domain <- store, app" },
    { crate = "chess-engine", wrappers = ["chess-app"], reason = "3.2: engine <- app only" },
    { crate = "chess-store", wrappers = ["chess-app"], reason = "3.2: store <- app only" },
    { crate = "chess-app", wrappers = ["chess-server", "chess-cli", "chess-desktop"], reason = "3.2, D-38: app is the only facade" },
    { crate = "chess-server", wrappers = ["chess-cli"], reason = "3.2: server <- cli (serve)" },
    # chess-cli and chess-desktop are leaves: nothing may depend on them. cargo-deny cannot
    # express that (an empty `wrappers` bans the crate outright), so
    # ci/check-crate-edges.mjs enforces it.
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
